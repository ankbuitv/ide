<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070a12" />
    <title>CP IDE - Competitive Programming IDE</title>
    <style>
      /* This shell is inline on purpose: it is visible before the JS bundle/WebView is ready. */
      html, body { width: 100%; height: 100%; margin: 0; background: #070a12; overflow: hidden; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 2147483647; display: grid; place-items: center;
        color: #e6edf3; font-family: "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(circle at 50% 42%, rgba(139, 92, 246, .22), transparent 25%),
          radial-gradient(circle at 65% 55%, rgba(34, 211, 238, .12), transparent 30%),
          #070a12;
        transition: opacity .42s ease, visibility .42s ease;
      }
      #boot-splash::before {
        content: ""; position: absolute; inset: 0; opacity: .22;
        background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
        background-size: 32px 32px; animation: boot-grid 5s linear infinite;
      }
      .boot-content { position: relative; width: 280px; text-align: center; }
      .boot-mark {
        width: 84px; height: 84px; margin: 0 auto 20px; display: grid; place-items: center;
        border: 1px solid rgba(125, 211, 252, .38); border-radius: 24px;
        background: linear-gradient(145deg, rgba(139,92,246,.25), rgba(34,211,238,.15));
        box-shadow: 0 0 56px rgba(124, 58, 237, .25), inset 0 0 22px rgba(255,255,255,.06);
        animation: boot-float 1.8s ease-in-out infinite;
      }
      .boot-mark svg { width: 52px; height: 52px; filter: drop-shadow(0 0 10px rgba(103,232,249,.35)); }
      .boot-title { font-weight: 700; font-size: 25px; letter-spacing: -.5px; }
      .boot-title span { color: #67e8f9; }
      .boot-subtitle { margin-top: 7px; color: #7d8590; font: 12px ui-monospace, Consolas, monospace; }
      .boot-track { width: 188px; height: 3px; margin: 24px auto 0; overflow: hidden; border-radius: 9px; background: #1f2937; }
      .boot-progress { width: 45%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #8b5cf6, #22d3ee); animation: boot-load 1.1s ease-in-out infinite; }
      #boot-status { min-height: 16px; margin-top: 12px; color: #64748b; font-size: 11px; }
      body.app-ready #boot-splash { opacity: 0; visibility: hidden; pointer-events: none; }
      @keyframes boot-load { from { transform: translateX(-120%); } to { transform: translateX(340%); } }
      @keyframes boot-float { 50% { transform: translateY(-5px); } }
      @keyframes boot-grid { to { background-position: 32px 32px; } }
      @media (prefers-reduced-motion: reduce) { .boot-mark, .boot-progress, #boot-splash::before { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" role="status" aria-live="polite">
      <div class="boot-content">
        <div class="boot-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <path d="M25 18 11 32l14 14M39 18l14 14-14 14" stroke="#e9d5ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="m36 12-8 40" stroke="#67e8f9" stroke-width="4" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="boot-title">CP <span>IDE</span></div>
        <div class="boot-subtitle">Competitive Programming Workspace</div>
        <div class="boot-track"><div class="boot-progress"></div></div>
        <div id="boot-status">Đang khởi tạo trình soạn thảo…</div>
      </div>
    </div>
    <script>
      // Never leave users with an unexplained black window if the frontend cannot start.
      window.__cpIdeBootTimer = window.setTimeout(function () {
        var status = document.getElementById("boot-status");
        if (status && !document.body.classList.contains("app-ready")) {
          status.textContent = "Khởi động lâu hơn dự kiến. Hãy đóng và mở lại ứng dụng.";
          status.style.color = "#fbbf24";
        }
      }, 10000);
      window.addEventListener("error", function () {
        var status = document.getElementById("boot-status");
        if (status) {
          status.textContent = "Không thể tải giao diện. Vui lòng cài lại phiên bản mới nhất.";
          status.style.color = "#f87171";
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
