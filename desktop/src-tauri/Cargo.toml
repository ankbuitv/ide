[package]
name = "cp-ide-desktop"
version = "1.0.0"
description = "CP IDE - Competitive Programming Desktop IDE"
authors = ["ankbuitv"]
edition = "2021"

[lib]
name = "cp_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
portable-pty = "0.8"
tempfile = "3"
chrono = "0.4"
dirs = "5"
toml = "0.8"
