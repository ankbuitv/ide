name = "online-ide"
compatibility_date = "2024-08-05"
pages_build_output_dir = "public"

# Optional: set your Node.js backend URL here or via Cloudflare dashboard env vars
# Example: BACKEND_URL = "https://your-backend.fly.dev"
[vars]
# BACKEND_URL = ""

# Cloudflare Pages Functions are auto-detected from ./functions directory
# No need for [build] section when deploying via Git integration
# If using Wrangler CLI:
#   build.command = ""
#   build.output_dir = "public"

[build]
command = ""
output_dir = "public"

# Uncomment to enable Piston fallback analytics or custom env
# [env.production.vars]
# BACKEND_URL = "https://ide-backend.example.com"
