name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid two simultaneous runs overwriting each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------
  # 1) Build & push the Docker image (for self-hosted / VPS)
  # ----------------------------------------------------------
  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # If you wire this up to push to GHCR / Docker Hub, configure the
      # login step here. Defaults to building only.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: |
            online-ide:latest
            online-ide:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-meta
          path: |
            Dockerfile
            docker-compose.yml
            backend
            public

  # ----------------------------------------------------------
  # 2) Deploy the FRONTEND to GitHub Pages (ide.ankb.qzz.io)
  #    - The frontend is fully static and calls the API via
  #      window.IDE_API_BASE (left as '' for same-origin use).
  #    - If you want to point the GH Pages frontend at a separate
  #      backend host, set the API_BASE in the env below.
  # ----------------------------------------------------------
  pages:
    name: Deploy frontend to GitHub Pages
    runs-on: ubuntu-latest
    needs: docker
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Inject the backend URL into a small config file the frontend reads.
      # The default is '' which means "same origin" — ideal when the
      # Docker container is fronting the static files as well.
      - name: Inject API base
        run: |
          mkdir -p public
          echo "window.IDE_API_BASE='${IDE_API_BASE:-}';" > public/config.js
          cat public/config.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: DNS hint
        if: success()
        run: |
          echo "::notice::Site deployed. To serve at ide.ankb.qzz.io, add a CNAME record:"
          echo "  ide.ankb.qzz.io  →  ${{ steps.deployment.outputs.page_url }}"
