name: Build and release ide.ankb desktop channels

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.channel }} · ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: standard
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
          - channel: beta
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
          - channel: nightly
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
          - channel: standard
            os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x64
          - channel: standard
            os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
          - channel: beta
            os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x64
          - channel: beta
            os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
          - channel: nightly
            os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x64
          - channel: nightly
            os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
          - channel: standard
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
          - channel: beta
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
          - channel: nightly
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Import Windows code-signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "ide-ankb-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate) { throw "Could not import the Windows signing certificate." }
          $configPath = Join-Path $env:GITHUB_WORKSPACE "desktop/src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.bundle.windows.certificateThumbprint = $certificate.Thumbprint
          $config | ConvertTo-Json -Depth 100 | Set-Content $configPath -Encoding utf8
          Remove-Item $pfxPath -Force

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build ${{ matrix.channel }}
        working-directory: desktop
        shell: bash
        run: npm run "tauri:build:${{ matrix.channel }}" -- --target "${{ matrix.target }}"

      - name: Package Windows portable
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: .\scripts\package-portable.ps1 -Channel "${{ matrix.channel }}" -BuildDir "src-tauri\target\${{ matrix.target }}\release"

      - name: Package macOS portable app
        if: runner.os == 'macOS'
        working-directory: desktop
        shell: bash
        run: |
          mkdir -p portable
          app_dir=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -type d -name '*.app' | head -n 1)
          test -n "$app_dir"
          ditto -c -k --sequesterRsrc --keepParent "$app_dir" "portable/ide-ankb-${{ matrix.channel }}-${{ matrix.platform }}-portable.zip"

      - name: Upload channel packages
        uses: actions/upload-artifact@v4
        with:
          name: ide-ankb-${{ matrix.channel }}-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**
            desktop/portable/**

  publish:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ide.ankb ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/**/*
