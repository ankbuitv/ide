name: "Build & Release ide.ankb"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe + .msi)
    runs-on: windows-latest
    env:
      # The `secrets` context cannot be used in step-level `if:` expressions,
      # so we mirror it into the job env and test `env.*` instead.
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        working-directory: desktop
        run: npm ci

      # A real CA-issued code-signing certificate is required for Windows to stop
      # showing "Unknown publisher". See docs/WINDOWS_SIGNING.md.
      - name: Import Windows code-signing certificate
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "ide-ankb-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate) { throw "Could not import the Windows signing certificate." }

          $configPath = Join-Path $env:GITHUB_WORKSPACE "desktop/src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.bundle.windows.certificateThumbprint = $certificate.Thumbprint
          $config | ConvertTo-Json -Depth 100 | Set-Content $configPath -Encoding utf8
          Remove-Item $pfxPath -Force
          "WINDOWS_SIGNING_ENABLED=true" | Out-File $env:GITHUB_ENV -Append
          Write-Host "Signing enabled with certificate: $($certificate.Subject)"

      - name: Warn when Windows build is unsigned
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 == '' }}
        shell: pwsh
        run: Write-Warning "No signing certificate configured; Windows will display 'Unknown publisher'. See docs/WINDOWS_SIGNING.md."

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: v__VERSION__
          releaseName: "ide.ankb v__VERSION__"
          releaseBody: |
            ## ide.ankb v__VERSION__

            ### Windows
            - `ide.ankb_v__VERSION___x64-setup.exe` — trình cài đặt NSIS (khuyên dùng)
            - `ide.ankb_v__VERSION___x64_en-US.msi` — gói MSI dành cho quản trị viên

            ### macOS
            - `ide.ankb_aarch64.dmg` — Apple Silicon
            - `ide.ankb_x64.dmg` — Intel

            ### Linux
            - `ide-ankb_amd64.AppImage` — Universal
            - `ide-ankb_amd64.deb` — Debian/Ubuntu

            ### Engine
            - Có Internet → chạy bằng **Judge0 CE**
            - Offline → chạy **native g++** (tự tìm trong Code::Blocks/MSYS2/WinLibs…, bỏ qua compiler hỏng thiếu DLL)

            ### Yêu cầu hệ thống
            - **Compiler** (chỉ khi offline): GCC 11+, Clang 14+, hoặc MSVC 2022
            - **RAM**: 2GB+
            - **Disk**: 200MB
          args: --verbose

  build-macos:
    name: Build macOS (.app + .dmg)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend deps
        working-directory: desktop
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: --target ${{ matrix.target }}

  build-linux:
    name: Build Linux (.AppImage + .deb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev

      - name: Install frontend deps
        working-directory: desktop
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: --verbose
