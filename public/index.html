<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ide.ankb — C++ Online IDE</title>
    <meta name="description" content="ide.ankb — Fast, dark VS Code–style C++ IDE with Monaco, Judge0 CE fallback." />
    <meta name="theme-color" content="#0d1117" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta property="og:title" content="ide.ankb — C++ Online IDE" />
    <meta property="og:description" content="Fast, dark, VS Code–style C++ IDE with Monaco, sandboxed execution, Judge0/Piston/Wandbox fallback." />
    <meta property="og:image" content="/logo.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mono-icons@1.9.0/iconfont/icons.css" />
    <style>
      :root{
        --bg-0:#0d1117; --bg-1:#161b22; --bg-2:#1c2128; --bg-3:#21262d;
        --border:#30363d; --border-2:#3a4148; --text:#c9d1d9; --text-dim:#8b949e; --text-mute:#6e7681;
        --accent:#2f81f7; --accent-2:#58a6ff; --green:#3fb950; --red:#f85149; --yellow:#d29922; --orange:#db6d28; --purple:#a371f7;
        --shadow:0 8px 24px rgba(0,0,0,.4); --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      }
      *{box-sizing:border-box} html,body{height:100%;margin:0}
      body{background:var(--bg-0);color:var(--text);font-family:var(--sans);font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased}
      .app{display:grid;grid-template-columns:48px 1fr;grid-template-rows:44px 28px 1fr 22px;height:100vh}
      /* Sidebar */
      .sidebar{grid-row:1 / 5; background:linear-gradient(180deg,#0d1117 0%,#121821 100%); border-right:1px solid var(--border); display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px; user-select:none}
      .sidebar .side-icon{width:36px;height:36px; display:flex;align-items:center;justify-content:center; border-radius:8px; color:var(--text-dim); cursor:pointer; transition:all .15s ease; font-size:18px; position:relative}
      .sidebar .side-icon:hover{background:var(--bg-3);color:var(--text)}
      .sidebar .side-icon.active{background:rgba(47,129,247,.15);color:var(--accent-2); border-left:2px solid var(--accent)}
      .sidebar .side-icon.active::after{content:'';position:absolute;left:-8px;top:20%;bottom:20%;width:2px;background:var(--accent);border-radius:2px}
      .sidebar .spacer{flex:1}
      .sidebar .side-icon.settings{margin-bottom:4px}
      /* Topbar */
      .topbar{grid-column:2; display:flex;align-items:center;height:44px;padding:0 12px;background:linear-gradient(180deg,#161b22 0%,#131820 100%);border-bottom:1px solid var(--border);user-select:none;gap:10px}
      .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;color:var(--text);font-family:var(--mono)}
      .brand .logo-img{width:28px;height:28px;border-radius:8px;object-fit:cover;box-shadow:0 1px 0 rgba(255,255,255,.15) inset,0 2px 8px rgba(0,0,0,.5);border:1px solid var(--border);flex:0 0 28px}
      .brand .brand-text{font-size:14px;background:linear-gradient(90deg,#58a6ff,#a371f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
      .menu-bar{display:flex;align-items:center;gap:2px;margin-left:8px}
      .menu-item{padding:4px 8px;border-radius:5px;font-size:12px;color:var(--text-dim);cursor:pointer;transition:all .12s}
      .menu-item:hover{background:var(--bg-3);color:var(--text)}
      .crumbs{display:flex;align-items:center;gap:6px;color:var(--text-dim);margin-left:8px;font-size:12px}
      .crumbs .sep{color:var(--text-mute)} .crumbs .file{color:var(--text);font-family:var(--mono)}
      .topbar .spacer{flex:1}
      .select-wrap{position:relative}
      .select-wrap select{appearance:none;background:var(--bg-2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 24px 5px 8px;font-size:11px;font-weight:500;cursor:pointer;transition:border .12s}
      .select-wrap select:hover{border-color:var(--border-2)} .select-wrap select:focus{outline:none;border-color:var(--accent)}
      .select-wrap::after{content:'▾';position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--text-mute);pointer-events:none;font-size:10px}
      .badge{ display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.3px; border:1px solid; cursor:default; transition:all .2s; position:relative}
      .badge .dot{width:8px;height:8px;border-radius:50%;}
      .badge.online{ background:rgba(63,185,80,.12); color:var(--green); border-color:rgba(63,185,80,.3); }
      .badge.online .dot{background:var(--green);box-shadow:0 0 8px var(--green); animation:pulse 2s infinite}
      .badge.connecting{ background:rgba(210,153,34,.12); color:var(--yellow); border-color:rgba(210,153,34,.3); }
      .badge.connecting .dot{background:var(--yellow);box-shadow:0 0 8px var(--yellow); animation:pulse 1s infinite}
      .badge.offline{ background:rgba(248,81,73,.12); color:var(--red); border-color:rgba(248,81,73,.3); }
      .badge.offline .dot{background:var(--red);box-shadow:0 0 8px var(--red);}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
      .badge .tooltip{visibility:hidden;position:absolute;top: calc(100% + 8px);right:0; background:var(--bg-2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:11px; font-weight:400; letter-spacing:0; min-width:220px; max-width:320px; box-shadow:var(--shadow); z-index:100; white-space:pre-wrap; line-height:1.4; opacity:0; transform:translateY(4px); transition:all .15s}
      .badge:hover .tooltip{visibility:visible; opacity:1; transform:none}
      .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;background:transparent;color:var(--text-dim);border:1px solid transparent;border-radius:6px;cursor:pointer;transition:all .12s}
      .icon-btn:hover{background:var(--bg-3);color:var(--text)} .icon-btn svg{width:16px;height:16px}
      .run-btn{ display:inline-flex;align-items:center;gap:8px; background:linear-gradient(180deg,#2ea043,#238636); color:#fff; border:1px solid #2ea043; padding:6px 14px; height:32px; border-radius:8px; font-weight:700; font-size:12px; cursor:pointer; box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 1px 2px rgba(0,0,0,.3); transition:all .15s; position:relative; overflow:hidden}
      .run-btn:hover{background:linear-gradient(180deg,#2fb44e,#2a9a3e); transform:translateY(-1px); box-shadow:0 4px 12px rgba(35,134,54,.4)} .run-btn:active{transform:translateY(0)}
      .run-btn[disabled]{opacity:.6;cursor:not-allowed;filter:grayscale(.3)} .run-btn.running{background:linear-gradient(180deg,#d29922,#b47d1a); border-color:#d29922; animation:runningPulse 1.2s infinite}
      .run-btn.success{background:linear-gradient(180deg,#3fb950,#2ea043); border-color:#3fb950} .run-btn.failed{background:linear-gradient(180deg,#f85149,#da3633); border-color:#f85149}
      @keyframes runningPulse{0%,100%{box-shadow:0 0 0 0 rgba(210,153,34,.4)}50%{box-shadow:0 0 0 8px rgba(210,153,34,0)}}
      .run-btn .key{margin-left:4px;padding:1px 6px;font-size:10px;background:rgba(0,0,0,.25);border-radius:4px;border:1px solid rgba(255,255,255,.15)}
      /* Tabbar */
      .tabbar{grid-column:2; display:flex;align-items:center;gap:4px;background:var(--bg-1);border-bottom:1px solid var(--border);padding:0 8px;overflow:hidden}
      .tab{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;height:22px;font-size:12px;background:var(--bg-2);color:var(--text);border:1px solid var(--border);border-bottom:none;border-top-left-radius:6px;border-top-right-radius:6px;position:relative;top:1px}
      .tab .lang-dot{width:8px;height:8px;border-radius:50%;background:#f34b7d;box-shadow:0 0 4px #f34b7d} .tab .close{margin-left:4px;cursor:pointer;color:var(--text-mute);font-size:14px} .tab .close:hover{color:var(--red)}
      .tabbar .tab-actions{margin-left:auto;display:flex;gap:4px}
      /* Workarea */
      .workarea{grid-column:2; display:grid;grid-template-columns:1fr 8px 420px;min-height:0}
      .gutter{background:transparent;cursor:col-resize;position:relative} .gutter::after{content:'';position:absolute;top:0;bottom:0;left:3px;width:2px;background:var(--border);transition:background .15s} .gutter:hover::after{background:var(--accent)}
      .editor-pane{background:var(--bg-0);position:relative;min-width:200px} .editor-host{position:absolute;inset:0}
      .right-pane{display:grid;grid-template-rows:36px 1fr 36px 1fr;background:var(--bg-1);border-left:1px solid var(--border);min-width:240px}
      .pane-head{display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--bg-2);border-bottom:1px solid var(--border);color:var(--text-dim);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;min-height:0}
      .pane-head .pane-title{color:var(--text)} .pane-head .actions{margin-left:auto;display:flex;gap:4px} .pane-head .chip{font-size:10px;padding:2px 6px;background:var(--bg-3);color:var(--text-dim);border:1px solid var(--border);border-radius:4px;font-weight:500;text-transform:none;letter-spacing:0}
      .pane-body{position:relative;min-height:0;overflow:hidden} .pane-body textarea{position:absolute;inset:0;width:100%;height:100%;resize:none;border:0;outline:none;padding:10px 12px;background:var(--bg-0);color:var(--text);font-family:var(--mono);font-size:13px;line-height:1.55;tab-size:4}
      .output{position:absolute;inset:0;overflow:auto;padding:10px 12px;font-family:var(--mono);font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word;background:var(--bg-0);transition:border .15s}
      .output.success{border-left:3px solid var(--green)} .output.error{border-left:3px solid var(--red)} .output.warning{border-left:3px solid var(--yellow)} .output.info{border-left:3px solid var(--accent)}
      .output .stderr{color:var(--red)} .output .stdout{color:var(--text)} .output .meta{color:var(--text-mute);font-size:11px;border-top:1px dashed var(--border);margin-top:8px;padding-top:6px;display:flex;gap:12px;flex-wrap:wrap}
      .output .meta .ok{color:var(--green)} .output .meta .err{color:var(--red)} .output .empty{color:var(--text-mute);font-style:italic;user-select:none}
      .output .compile-error{color:var(--red);font-weight:600}
      /* Statusbar */
      .statusbar{grid-column:2; display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,#161b22 0%,#131820 100%);border-top:1px solid var(--border);padding:0 10px;font-size:11px;color:var(--text-dim);user-select:none}
      .statusbar .seg{display:inline-flex;align-items:center;gap:6px} .statusbar .seg svg{width:12px;height:12px} .statusbar .accent{color:var(--accent-2)} .statusbar .right{margin-left:auto;display:flex;gap:14px}
      .statusbar .build-progress{width:80px;height:3px;background:var(--bg-3);border-radius:2px;overflow:hidden;display:none} .statusbar .build-progress .bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--purple));width:0%;transition:width .3s; animation:buildAnim 1.2s infinite}
      @keyframes buildAnim{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
      /* Toast */
      .toast-host{position:fixed;right:16px;bottom:32px;z-index:9999;display:flex;flex-direction:column;gap:8px}
      .toast{min-width:240px;max-width:360px;padding:10px 12px;background:var(--bg-2);color:var(--text);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;box-shadow:var(--shadow);font-size:12px;animation:slideIn .18s ease;backdrop-filter:blur(8px)}
      .toast.error{border-left-color:var(--red)} .toast.ok{border-left-color:var(--green)} .toast.warn{border-left-color:var(--yellow)} @keyframes slideIn{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
      /* Spinner */
      .spinner{width:12px;height:12px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block} @keyframes spin{to{transform:rotate(360deg)}}
      /* Context menu */
      #ctx-menu{position:fixed;z-index:10000;min-width:240px;padding:6px;background:var(--bg-2);border:1px solid var(--border-2);border-radius:10px;box-shadow:var(--shadow);font-family:var(--sans);font-size:12px;color:var(--text);animation:ctxIn .08s ease-out;backdrop-filter:blur(12px)}
      @keyframes ctxIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}} #ctx-menu ul{list-style:none;margin:0;padding:0} #ctx-menu li.ctx-item{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;cursor:pointer;user-select:none;outline:none} #ctx-menu li.ctx-item:hover,#ctx-menu li.ctx-item:focus{background:var(--bg-3)} #ctx-menu li.ctx-item.disabled{color:var(--text-mute);cursor:not-allowed;opacity:.55} #ctx-menu li.ctx-item.danger{color:#ff8b8b} #ctx-menu li.ctx-item.danger:hover{background:rgba(248,81,73,.12)} #ctx-menu li.ctx-item .ctx-ico{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;color:var(--accent-2);flex:0 0 16px} #ctx-menu li.ctx-item .ctx-ico svg{width:14px;height:14px} #ctx-menu li.ctx-item .ctx-text{flex:1} #ctx-menu li.ctx-item .ctx-sc{font-family:var(--mono);font-size:10px;color:var(--text-mute);background:var(--bg-1);padding:1px 6px;border-radius:4px;border:1px solid var(--border)} #ctx-menu li.ctx-header{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-mute);padding:6px 8px 4px;cursor:default} #ctx-menu li.ctx-sep{height:1px;background:var(--border);margin:4px}
      /* DevTools banner */
      #dt-warning{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9998;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#2d1a1a 0%,#1d1116 100%);border:1px solid #5b1f1f;border-left:3px solid var(--red);color:#ffd7d7;padding:8px 12px 8px 10px;border-radius:10px;box-shadow:var(--shadow);font-size:12px;max-width:90vw;animation:ctxIn .15s ease} #dt-warning svg{width:16px;height:16px;color:var(--red);flex:0 0 16px} #dt-warning b{color:#fff} #dt-warning button{background:transparent;color:#ffd7d7;border:1px solid #5b1f1f;border-radius:6px;padding:2px 8px;font-size:11px;cursor:pointer;margin-left:4px} #dt-warning button:hover{background:rgba(248,81,73,.15)}
      .no-select{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
      @media (max-width: 900px){ .app{grid-template-columns:1fr;grid-template-rows:44px 28px 1fr 22px} .sidebar{display:none} .workarea{grid-column:1;grid-template-columns:1fr;grid-template-rows:1fr 8px 1fr} .right-pane{border-left:0;border-top:1px solid var(--border)} .gutter::after{left:0;right:0;top:3px;height:2px;width:auto} .menu-bar{display:none} .crumbs{display:none} }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- Sidebar -->
      <nav class="sidebar no-select" aria-label="Activity Bar">
        <div class="side-icon active" data-tip="Explorer" title="Explorer (Ctrl+Shift+E)">📁</div>
        <div class="side-icon" data-tip="Search" title="Search (Ctrl+Shift+F)">🔍</div>
        <div class="side-icon" data-tip="Source Control" title="Source Control">🌿</div>
        <div class="side-icon" data-tip="Run" title="Run and Debug">▶️</div>
        <div class="side-icon" data-tip="Extensions" title="Extensions">🧩</div>
        <div class="spacer"></div>
        <div class="side-icon" data-tip="Open File" title="Open File (Ctrl+O)" id="sideOpenFile">📂</div>
        <div class="side-icon" data-tip="Download" title="Download File (Ctrl+S)" id="sideDownload">💾</div>
        <div class="side-icon settings" data-tip="Settings" title="Settings">⚙️</div>
      </nav>

      <!-- Top bar -->
      <header class="topbar no-select">
        <div class="brand">
          <img class="logo-img" src="/logo.png" alt="ide.ankb" width="28" height="28" loading="eager" onerror="this.src='https://i.ibb.co/Gfg90tSr/ide-ankb.jpg'" />
          <span class="brand-text">ide.ankb</span>
        </div>
        <div class="menu-bar">
          <div class="menu-item" id="menuFile">File</div>
          <div class="menu-item" id="menuEdit">Edit</div>
          <div class="menu-item" id="menuView">View</div>
          <div class="menu-item" id="menuRun">Run</div>
          <div class="menu-item" id="menuHelp">Help</div>
        </div>
        <div class="crumbs" aria-hidden="true">
          <span>workspace</span><span class="sep">/</span>
          <span class="file" id="fileName">main.cpp</span>
        </div>

        <div class="spacer"></div>

        <div class="select-wrap" title="Choose C++ standard">
          <select id="cppVersion">
            <option value="17">C++17</option>
            <option value="20">C++20</option>
            <option value="23" selected>C++23</option>
            <option value="14">C++14</option>
            <option value="11">C++11</option>
          </select>
        </div>

        <div class="select-wrap" title="Choose theme">
          <select id="themeSelect">
            <option value="ide-dark" selected>Dark+</option>
            <option value="vs-dark">VS Dark</option>
            <option value="hc-black">High Contrast</option>
            <option value="github-dark">GitHub Dark</option>
          </select>
        </div>

        <div class="badge offline" id="connBadge" title="Checking connection...">
          <span class="dot" id="netDot"></span>
          <span id="netLabel">Offline</span>
          <span class="tooltip" id="connTooltip">Checking backend...&#10;Mode: unknown&#10;Click to retry</span>
        </div>

        <button class="icon-btn" id="openFileBtn" title="Open file (Ctrl+O)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        </button>
        <button class="icon-btn" id="downloadBtn" title="Download file (Ctrl+S)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <button class="icon-btn" id="formatBtn" title="Format (Shift+Alt+F)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16"/><path d="M4 12h10"/><path d="M4 18h7"/></svg>
        </button>
        <button class="icon-btn" id="resetBtn" title="Reset to template">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
        <button class="run-btn" id="runBtn" title="Run (F9)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8V4z"/></svg>
          <span id="runLabel">Run</span>
          <span class="key">F9</span>
        </button>
      </header>

      <!-- Tabs -->
      <div class="tabbar no-select" role="tablist">
        <div class="tab" role="tab">
          <span class="lang-dot"></span>
          <span id="tabFile">main.cpp</span>
          <span class="close" id="closeTab" title="Discard">×</span>
        </div>
        <div class="tab-actions">
          <span class="chip" id="langChip">C++23</span>
          <span class="chip" id="autoSaveChip" title="Auto Save enabled">Auto Save ✓</span>
        </div>
      </div>

      <!-- Work area -->
      <main class="workarea">
        <section class="editor-pane" aria-label="Code editor">
          <div class="editor-host" id="editor"></div>
        </section>
        <div class="gutter" id="gutter" role="separator" aria-orientation="vertical"></div>
        <aside class="right-pane" aria-label="Input and Output">
          <div class="pane-head">
            <span class="pane-title">Input (stdin)</span>
            <span class="actions">
              <button class="icon-btn" id="clearStdinBtn" title="Clear">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6 18 20a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
              </button>
            </span>
          </div>
          <div class="pane-body">
            <textarea id="stdin" spellcheck="false" placeholder="5&#10;1 2 3 4 5"></textarea>
          </div>
          <div class="pane-head">
            <span class="pane-title">Output</span>
            <span class="actions">
              <span class="chip" id="timeChip">— ms</span>
              <button class="icon-btn" id="clearOutBtn" title="Clear output">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6 18 20a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
              </button>
            </span>
          </div>
          <div class="pane-body">
            <div class="output" id="output"><div class="empty">// Run your code to see the output here</div></div>
          </div>
        </aside>
      </main>

      <!-- Status bar -->
      <footer class="statusbar no-select">
        <span class="seg accent">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></svg>
          <span id="statusLang">C++23</span>
        </span>
        <span class="seg" id="statusCursor">Ln 1, Col 1</span>
        <span class="seg" id="statusEncoding">UTF-8</span>
        <span class="seg" id="statusSpaces">Spaces: 4</span>
        <div class="statusbar build-progress" id="buildProgress"><div class="bar" id="buildBar"></div></div>
        <div class="right">
          <span class="seg" id="statusBackend" title="Backend mode">Mode: —</span>
          <span class="seg" id="statusMsg">Ready</span>
          <span class="seg" id="statusTime">— ms</span>
        </div>
      </footer>
    </div>

    <input type="file" id="openFileInput" accept=".cpp,.cc,.c,.h,.hpp,.txt" style="display:none" />

    <div class="toast-host" id="toastHost" aria-live="polite"></div>

    <script src="/config.js" defer></script>
    <script src="/security.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <script src="/app.js" defer></script>
  </body>
